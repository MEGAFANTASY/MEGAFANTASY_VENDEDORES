<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Admin MEGAFANTASY</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="admin-body">
  <nav class="admin-nav">
    <span class="brand">MEGAFANTASY</span>
    <div class="nav-actions">
      <button id="btn-cartera" class="nav-btn active">Cartera</button>
      <button id="btn-vendedores" class="nav-btn">Vendedores</button>
      <button id="btn-empresas" class="nav-btn">Otras empresas</button>
      <button id="btn-logout" class="nav-btn logout">Cerrar sesión</button>
    </div>
  </nav>

  <main class="admin-main">
    <section id="section-cartera" class="admin-section active">
      <div class="cartera-header">
        <h2>Cartera</h2>
        <div class="cartera-total">Total saldo: <span id="cartera-total-saldo">$0</span></div>
      </div>
      <div class="cartera-filters">
        <div class="filter-row">
          <input type="text" id="search-cartera" class="search-input" placeholder="Buscar por cliente, factura o ciudad..." />
        </div>
        <div class="filter-row">
          <div class="ciudades-dropdown" id="ciudades-dropdown">
            <div class="ciudades-trigger" id="ciudades-trigger">Ciudades</div>
            <button type="button" id="btn-limpiar-ciudades" class="limpiar-ciudades hidden">Limpiar ciudades</button>
            <div class="ciudades-panel hidden" id="ciudades-panel">
              <div class="ciudades-options" id="ciudades-options"></div>
            </div>
          </div>
          <div class="status-filters">
          <button class="status-btn active" data-status="todas">Todas</button>
          <button class="status-btn" data-status="auditoria">Auditoria</button>
          <button class="status-btn" data-status="vencida">Vencida</button>
          <button class="status-btn" data-status="programar">Programar</button>
          <button class="status-btn" data-status="vigente">Vigente</button>
        </div>
      </div>
      <div id="cartera-loading" class="loading">Cargando facturas...</div>
      <div id="cartera-table-wrap" class="table-wrap hidden">
        <table class="data-table">
          <thead>
            <tr>
              <th>Días</th>
              <th>Cliente</th>
              <th>Dirección</th>
              <th>Ciudad</th>
              <th>Factura</th>
              <th>Saldo</th>
              <th>Estatus</th>
              <th>Docs</th>
            </tr>
          </thead>
          <tbody id="cartera-body"></tbody>
        </table>
      </div>
      <div id="cartera-empty" class="empty hidden">No hay facturas registradas.</div>
    </section>

    <section id="section-vendedores" class="admin-section">
      <h2>Vendedores</h2>
      <div id="vendedores-list-wrap" class="vendedores-wrap">
        <div id="vendedores-loading" class="loading">Cargando vendedores...</div>
        <div id="vendedores-empty" class="empty hidden">No hay vendedores creados.</div>
        <div id="vendedores-cards" class="vendedores-cards hidden"></div>
      </div>
      <button id="btn-add-vendedor" class="add-vendedor-btn">Agregar vendedor</button>
    </section>
  </main>

  <div id="modal-vendedor" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <h3 id="modal-titulo">Crear usuario vendedor</h3>
      <input type="hidden" id="input-id" value="" />
      <label for="select-vendedor">VENDEDOR</label>
      <select id="select-vendedor">
        <option value="">Selecciona un vendedor</option>
      </select>
      <label for="input-usuario">USUARIO</label>
      <input type="text" id="input-usuario" placeholder="Ej: LAZARO" />
      <label for="input-contrasena">CONTRASEÑA</label>
      <input type="text" id="input-contrasena" placeholder="Mínimo 4 caracteres" />
      <div id="modal-error" class="error"></div>
      <div class="modal-actions">
        <button id="btn-cancelar-modal" class="nav-btn">Cancelar</button>
        <button id="btn-guardar-vendedor" class="nav-btn">Guardar</button>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
